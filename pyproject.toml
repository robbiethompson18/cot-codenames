[project]
name = "cot-codenames"
version = "0.1.0"
description = "Codenames with a CoT monitor: can open-weight reasoning models play spymaster without leaking board words in their chain of thought?"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.9.0",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cot_codenames"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
extend-select = [
  "I",     # isort — ruff owns import ordering too
  "E501",  # line too long — not in ruff's defaults, and `ruff format` never wraps strings/comments
]

[tool.ruff.lint.per-file-ignores]
"src/cot_codenames/dashboard.py" = ["E501"]  # embedded HTML/JS template, not worth wrapping
"scripts/stego_report/*.py" = ["E501", "SIM115", "RUF015", "PLW1510", "BLE001"]  # one-off HTML report builders

[dependency-groups]
dev = [
    "nltk>=3.10.3",
    "ruff>=0.16.9",
    "ty>=0.0.84",
    "wordfreq>=3.1.1",
]
# BashArena rollouts (needs Docker): uv run --group basharena python -m cot_codenames.basharena.baseline
basharena = [
    "control-arena>=20.0.1",
]
tinker = [
    "tinker>=0.32.0",
    "tinker-cookbook>=0.5.7",
]
# Local (RunPod) backend of the stego trainer: uv run --group train python -m cot_codenames.stego.train --backend local
train = [
    "accelerate",
    "flash-linear-attention",  # Qwen3.5/3.6 fast path; without it every forward pass is several times slower
    "huggingface-hub",
    "peft",
    "torch",
    "transformers",
]

# Linux pods get the CUDA 12.6 build of torch. The default (CUDA 13) wheel needs NVIDIA driver 580+, and about half of
# RunPod's H200 hosts were still on 570 on 2026-10-08: torch then sees no GPU at all.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true
