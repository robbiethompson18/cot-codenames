[project]
name = "cot-codenames"
version = "0.1.0"
description = "Codenames with a CoT monitor: can open-weight reasoning models play spymaster without leaking board words in their chain of thought?"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cot_codenames"]

[tool.ruff]
line-length = 140

[tool.ruff.lint]
extend-select = ["I"]   # isort — ruff owns import ordering too

[dependency-groups]
dev = [
    "ruff>=0.16.9",
    "ty>=0.0.84",
]
